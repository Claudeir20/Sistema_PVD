# Perfil dos testes: banco H2 em memória, no modo PostgreSQL, apagado ao fim dos testes.
# Ative com @ActiveProfiles("test") na classe de teste.
spring.datasource.url=jdbc:h2:mem:sistema_pdv;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.show-sql=false
