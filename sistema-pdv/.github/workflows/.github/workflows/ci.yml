name: CI

on:
  push:
    branches: [master]
  pull_request:

job:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
      with: 
         distribution: temurin
          java-version: "21"
          cache: maven

      
      - run: sh ./mvnw -B test 
