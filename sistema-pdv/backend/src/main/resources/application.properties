# Configurações comuns a todos os perfis.
spring.application.name=sistema-pdv

# Sem perfil informado, a aplicação roda como "dev" (banco local).
# Em produção, defina SPRING_PROFILES_ACTIVE=prod.
spring.profiles.default=dev

# As tabelas são criadas pelo Flyway; o Hibernate só confere se as entidades batem com elas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Datas gravadas em UTC; a conversão para o horário de Brasília acontece na exibição.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Primeiro admin, criado só se o banco não tiver nenhum usuário.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}


#Sessão: expira após 4 horas sem nenhuma requisição (inatividade, não duração total).
server.servlet.session.timeout=4h


# Cookie da sessão
server.servlet.session.cookie.name=PVD_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# A sessão só anda em cookie, nunca na URL (evita ;jsessionid=... em links e logs).
server.servlet.session.tracking-modes=cookie

