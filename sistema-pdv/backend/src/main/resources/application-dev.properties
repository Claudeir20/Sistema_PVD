# Perfil de desenvolvimento: PostgreSQL local.
# Os valores depois de ":" são o padrão; para mudar sem editar o arquivo,
# defina as variáveis DB_URL, DB_USER e DB_PASSWORD (no terminal ou na Run Configuration do IntelliJ).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sistema_pdv}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
