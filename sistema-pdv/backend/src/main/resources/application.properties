# Configurações comuns a todos os perfis.
spring.application.name=sistema-pdv

# Sem perfil informado, a aplicação roda como "dev" (banco local).
# Em produção, defina SPRING_PROFILES_ACTIVE=prod.
spring.profiles.default=dev

# As tabelas são criadas pelo Flyway; o Hibernate só confere se as entidades batem com elas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Datas gravadas em UTC; a conversão para o horário de Brasília acontece na exibição.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
