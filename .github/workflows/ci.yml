
name: CI                      # nome que aparece na aba Actions

on:                           # 1. QUANDO roda
  push:
    branches: [master]
  pull_request:

jobs:                         # 2. O QUE roda (jobs em paralelo)
  backend:
    runs-on: ubuntu-latest    # máquina emprestada pelo GitHub
    defaults:
      run:
        working-directory: sistema-pdv/backend
    steps:                    # 3. PASSO A PASSO de cada job
      - uses: actions/checkout@v4        # "uses" = ação pronta da comunidade
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: sh ./mvnw -B test           # "run"  = comando de terminal

  frontend:                   # roda ao mesmo tempo que o backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sistema-pdv/frontend
    steps:                    # os mesmos passos do Dockerfile, para o erro aparecer no PR e não no deploy
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3               # mesma versão do Dockerfile
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: sistema-pdv/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit      # tipos do TypeScript
      - run: pnpm test                   # testes (vitest)
      - run: pnpm build                  # o build que vai para dentro do JAR
